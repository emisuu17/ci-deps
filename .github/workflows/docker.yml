name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker
  cancel-in-progress: false

jobs:
  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: imagem
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: producao
      url: http://${{ vars.EC2_HOST }}/soma?a=2&b=3
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TOKEN,ATOR,REPO
          script: |
            IMAGEM=$(echo "ghcr.io/$REPO:latest" | tr '[:upper:]' '[:lower:]')
            echo "$TOKEN" | docker login ghcr.io -u "$ATOR" --password-stdin
            docker pull "$IMAGEM"
            docker rm -f ci-exemplo || true
            docker run -d --name ci-exemplo --restart unless-stopped -p 80:3000 "$IMAGEM"
            docker logout ghcr.io
            docker image prune -f